name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: airports-radio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          mkdir music
          for s in 3 5 7 11; do
            docker run --rm --entrypoint ffmpeg -v "$PWD/music:/out" airports-radio:test \
              -loglevel error -f lavfi -i "sine=f=$((s * 40)):d=$s" "/out/t$s.flac"
          done
          docker run -d --name radio -p 8000:8000 -v "$PWD/music:/music:ro" airports-radio:test
          sleep 8
          docker logs radio
          curl -s --max-time 5 http://localhost:8000/airports -o sample.mp3 || true
          ls -l sample.mp3
          test "$(stat -c %s sample.mp3)" -gt 50000

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
